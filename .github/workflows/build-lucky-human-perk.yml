name: Build Lucky Human Perk

on:
  push:
    branches:
      - feature/lucky-human-perk
    paths:
      - 'LuckyHumanPerk/**'
      - '.github/workflows/build-lucky-human-perk.yml'
      - 'Managed.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Lucky Human Perk
        run: dotnet build LuckyHumanPerk/LuckyHumanPerk.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}\LuckyHumanPerkPackage"
          $package = Join-Path $root "LuckyHumanPerk"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item LuckyHumanPerk\manifest.xml $package\manifest.xml
          Copy-Item LuckyHumanPerk\bin\Release\netstandard2.1\LuckyHumanPerk.dll $package\LuckyHumanPerk.dll
          Copy-Item -Recurse LuckyHumanPerk\Localization $package\Localization
          $icon = "LuckyHumanPerk\Textures\Items\lucky_human_icon.png"
          if (!(Test-Path $icon)) { throw "Lucky Human perk icon is missing from Textures/Items." }
          New-Item -ItemType Directory -Force -Path (Join-Path $package "Textures\Items") | Out-Null
          Copy-Item $icon (Join-Path $package "Textures\Items\lucky_human_icon.png")
          Compress-Archive -Path "$root\*" -DestinationPath "${{ runner.temp }}\LuckyHumanPerk.zip" -Force

      - name: Verify installable mod package
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\LuckyHumanPerk.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries | ForEach-Object FullName
          $archive.Dispose()
          if ($names -notcontains "LuckyHumanPerk/manifest.xml") { throw "Manifest missing from ZIP" }
          if ($names -notcontains "LuckyHumanPerk/LuckyHumanPerk.dll") { throw "DLL missing from ZIP" }
          if ($names -notcontains "LuckyHumanPerk/Textures/Items/lucky_human_icon.png") { throw "Starting perk icon missing from ZIP" }

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: LuckyHumanPerk
          path: ${{ runner.temp }}\LuckyHumanPerk.zip
          if-no-files-found: error

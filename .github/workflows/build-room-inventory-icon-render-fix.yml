name: Build Room Inventory Icon Render Fix

on:
  push:
    branches:
      - fix/room-inventory-icon-render-order
    paths:
      - 'RoomInventoryIconRenderFix/**'
      - 'Managed.zip'
      - '.github/workflows/build-room-inventory-icon-render-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Room Inventory Icon Render Fix
        run: dotnet build RoomInventoryIconRenderFix/RoomInventoryIconRenderFix.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $package = "${{ runner.temp }}\RoomInventoryIconRenderFix"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item RoomInventoryIconRenderFix\manifest.xml $package\manifest.xml
          Copy-Item RoomInventoryIconRenderFix\bin\Release\netstandard2.1\RoomInventoryIconRenderFix.dll $package\RoomInventoryIconRenderFix.dll
          Compress-Archive -Path "$package\*" -DestinationPath "${{ runner.temp }}\RoomInventoryIconRenderFix.zip" -Force

      - name: Verify installable package
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\RoomInventoryIconRenderFix.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries | ForEach-Object FullName
          $archive.Dispose()
          $required = @("manifest.xml", "RoomInventoryIconRenderFix.dll")
          foreach ($entry in $required) {
            if ($names -notcontains $entry) { throw "Package is missing: $entry" }
          }

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: RoomInventoryIconRenderFix
          path: ${{ runner.temp }}\RoomInventoryIconRenderFix.zip
          if-no-files-found: error

name: Build Rei NPC

on:
  push:
    branches:
      - feature/rei-red-dragon-merchant
    paths:
      - 'ReiNPC/**'
      - 'Managed.zip'
      - '.github/workflows/build-rei-npc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Rei NPC
        run: dotnet build ReiNPC/ReiNPC.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $package = "${{ runner.temp }}\ReiNPC"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item ReiNPC\manifest.xml $package\manifest.xml
          Copy-Item ReiNPC\bin\Release\netstandard2.1\ReiNPC.dll $package\ReiNPC.dll
          Copy-Item -Recurse ReiNPC\Textures $package\Textures
          Copy-Item -Recurse ReiNPC\Localization $package\Localization
          Compress-Archive -Path "$package\*" -DestinationPath "${{ runner.temp }}\ReiNPC.zip" -Force

      - name: Verify installable package
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\ReiNPC.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries | ForEach-Object FullName
          $archive.Dispose()
          $required = @(
            "manifest.xml",
            "ReiNPC.dll",
            "Textures/rei.png",
            "Textures/Items/red_dragon_energy.png",
            "Textures/Items/modern_cup_noodle.png",
            "Localization/en.csv",
            "Localization/vi.csv"
          )
          foreach ($entry in $required) {
            if ($names -notcontains $entry) { throw "Package is missing: $entry" }
          }

          # Validate the cup-noodle sprite bytes and its intended 1x2-cell footprint.
          $pngEntry = $archive.GetEntry("Textures/Items/modern_cup_noodle.png")
          $pngStream = $pngEntry.Open()
          $header = New-Object byte[] 24
          $read = $pngStream.Read($header, 0, 24)
          $pngStream.Dispose()
          if ($read -ne 24) { throw "Modern cup noodle PNG header is incomplete." }
          $signature = [System.Convert]::ToHexString($header[0..7])
          if ($signature -ne "89504E470D0A1A0A") { throw "Modern cup noodle asset is not a valid PNG." }
          $width = ([int]$header[16] * 16777216) + ([int]$header[17] * 65536) + ([int]$header[18] * 256) + [int]$header[19]
          $height = ([int]$header[20] * 16777216) + ([int]$header[21] * 65536) + ([int]$header[22] * 256) + [int]$header[23]
          if ($width -ne 64 -or $height -ne 128) {
            throw "Modern cup noodle sprite must be 64x128 px (1x2 inventory cells), got $($width)x$($height)."
          }

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: ReiNPC
          path: ${{ runner.temp }}\ReiNPC.zip
          if-no-files-found: error

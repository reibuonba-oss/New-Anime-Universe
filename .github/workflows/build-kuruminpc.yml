name: Build Kurumi NPC

on:
  push:
    branches:
      - feature/kurumi-arms-dealer
    paths:
      - 'KurumiNPC/**'
      - 'Managed.zip'
      - '.github/workflows/build-kuruminpc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Kurumi NPC
        run: dotnet build KurumiNPC/KurumiNPC.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $package = "${{ runner.temp }}\KurumiNPC"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item KurumiNPC\manifest.xml $package\manifest.xml
          Copy-Item KurumiNPC\bin\Release\netstandard2.1\KurumiNPC.dll $package\KurumiNPC.dll
          Copy-Item -Recurse KurumiNPC\Textures $package\Textures
          Copy-Item -Recurse KurumiNPC\Localization $package\Localization
          Compress-Archive -Path "$package\*" -DestinationPath "${{ runner.temp }}\KurumiNPC.zip" -Force

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: KurumiNPC
          path: ${{ runner.temp }}\KurumiNPC.zip
          if-no-files-found: error

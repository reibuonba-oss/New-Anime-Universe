name: Build Extra Privilege Perk

on:
  push:
    branches:
      - feature/extra-privilege-perk
    paths:
      - 'ExtraPrivilegePerk/**'
      - '.github/workflows/build-extra-privilege-perk.yml'
      - 'Managed.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Extra Privilege Perk
        run: dotnet build ExtraPrivilegePerk/ExtraPrivilegePerk.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}\ExtraPrivilegePerkPackage"
          $package = Join-Path $root "ExtraPrivilegePerk"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "ExtraPrivilegePerk\manifest.xml" (Join-Path $package "manifest.xml")
          Copy-Item "ExtraPrivilegePerk\bin\Release\netstandard2.1\ExtraPrivilegePerk.dll" (Join-Path $package "ExtraPrivilegePerk.dll")
          Copy-Item -Recurse "ExtraPrivilegePerk\Localization" (Join-Path $package "Localization")
          $icon = "ExtraPrivilegePerk\Textures\Items\extra_privilege_icon.png"
          if (!(Test-Path $icon)) { throw "Perk icon is missing from Textures/Items." }
          New-Item -ItemType Directory -Force -Path (Join-Path $package "Textures\Items") | Out-Null
          Copy-Item $icon (Join-Path $package "Textures\Items\extra_privilege_icon.png")
          Compress-Archive -Path "$root\*" -DestinationPath "${{ runner.temp }}\ExtraPrivilegePerk.zip" -Force

      - name: Verify installable mod package
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\ExtraPrivilegePerk.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries | ForEach-Object FullName
          $archive.Dispose()
          if ($names -notcontains "ExtraPrivilegePerk/manifest.xml") { throw "Manifest missing from ZIP" }
          if ($names -notcontains "ExtraPrivilegePerk/ExtraPrivilegePerk.dll") { throw "DLL missing from ZIP" }
          if ($names -notcontains "ExtraPrivilegePerk/Localization/vi.csv") { throw "Vietnamese localization missing from ZIP" }
          if ($names -notcontains "ExtraPrivilegePerk/Textures/Items/extra_privilege_icon.png") { throw "Starting perk icon missing from ZIP" }

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: ExtraPrivilegePerk
          path: ${{ runner.temp }}\ExtraPrivilegePerk.zip
          if-no-files-found: error

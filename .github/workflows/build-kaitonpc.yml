name: Build Kaito NPC

on:
  push:
    branches:
      - feature/kaito-collector
      - feature/advanced-battery-charger
    paths:
      - 'KaitoNPC/**'
      - '.github/workflows/build-kaitonpc.yml'
      - 'Managed.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Kaito NPC
        run: dotnet build KaitoNPC/KaitoNPC.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Create CI portrait placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path KaitoNPC\Textures | Out-Null
          $png = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNgYGBgAAAABQABeqhXUAAAAABJRU5ErkJggg==')
          [IO.File]::WriteAllBytes('KaitoNPC\Textures\kaito.png', $png)

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}\KaitoPackage"
          $package = Join-Path $root "KaitoNPC"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item KaitoNPC\manifest.xml $package\manifest.xml
          Copy-Item KaitoNPC\bin\Release\netstandard2.1\KaitoNPC.dll $package\KaitoNPC.dll
          Copy-Item -Recurse KaitoNPC\Textures $package\Textures
          Copy-Item -Recurse KaitoNPC\Localization $package\Localization
          Compress-Archive -Path "$root\*" -DestinationPath "${{ runner.temp }}\KaitoNPC.zip" -Force

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: KaitoNPC
          path: ${{ runner.temp }}\KaitoNPC.zip
          if-no-files-found: error

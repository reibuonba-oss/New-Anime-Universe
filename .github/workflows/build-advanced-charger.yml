name: Build Advanced Battery Charger

on:
  push:
    branches:
      - feature/advanced-battery-charger
    paths:
      - 'AdvancedCharger/**'
      - 'Managed.zip'
      - '.github/workflows/build-advanced-charger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract game reference assemblies
        shell: pwsh
        run: Expand-Archive -Path "${{ github.workspace }}\Managed.zip" -DestinationPath "${{ github.workspace }}\references\Managed" -Force

      - name: Build Advanced Battery Charger
        run: dotnet build AdvancedCharger/AdvancedCharger.csproj --configuration Release -p:ManagedDir="${{ github.workspace }}\references\Managed"

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}\AdvancedChargerPackage"
          $package = Join-Path $root "AdvancedCharger"
          New-Item -ItemType Directory -Force -Path (Join-Path $package "Localization") | Out-Null
          Copy-Item AdvancedCharger\manifest.xml $package\manifest.xml
          Copy-Item AdvancedCharger\bin\Release\netstandard2.1\AdvancedCharger.dll $package\AdvancedCharger.dll
          Copy-Item AdvancedCharger\Localization\* (Join-Path $package "Localization")
          Compress-Archive -Path "$root\*" -DestinationPath "${{ runner.temp }}\AdvancedCharger.zip" -Force

      - name: Verify install package
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\AdvancedCharger.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries | ForEach-Object FullName
          $archive.Dispose()
          if ($names -notcontains "AdvancedCharger/manifest.xml") { throw "Manifest missing from ZIP" }
          if ($names -notcontains "AdvancedCharger/AdvancedCharger.dll") { throw "DLL missing from ZIP" }
          if ($names -notcontains "AdvancedCharger/Localization/en.csv") { throw "English localization missing from ZIP" }
          if ($names -notcontains "AdvancedCharger/Localization/vi.csv") { throw "Vietnamese localization missing from ZIP" }

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedCharger
          path: ${{ runner.temp }}\AdvancedCharger.zip
          if-no-files-found: error
